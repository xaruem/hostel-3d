<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жилой комплекс — 3D-вьюер</title>
<style>
:root{--ink:#16202c;--mut:#5c6b7d;--acc:#1f7be0;--glass:rgba(255,255,255,.84);--solid:#fff;--line:rgba(255,255,255,.65);--bd:rgba(20,40,70,.12);--card:rgba(255,255,255,.6);--ok:#1fae6b;--hold:#f0a020;--sold:#8793a6;color-scheme:light}
body.night{--ink:#e8eefb;--mut:#9fb0cc;--glass:rgba(16,24,42,.8);--solid:#16203a;--line:rgba(160,190,255,.2);--bd:rgba(160,190,255,.16);--card:rgba(255,255,255,.05);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#9fc4e8;overflow:hidden}
button{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 8px 30px rgba(10,20,40,.16);border-radius:16px;transition:background .6s,color .6s,opacity .35s,transform .4s cubic-bezier(.2,.9,.3,1)}

/* верхняя строка */
.top{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:4}
.top>*{pointer-events:auto}
.ttl{padding:10px 14px}
.ttl h1{font-size:16px;font-weight:650}
.ttl p{font-size:12px;color:var(--mut);margin-top:2px}
.tools{display:flex;gap:8px;align-items:center}
.ic,.pill{height:40px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink);cursor:pointer;border-radius:12px;box-shadow:0 6px 18px rgba(10,20,40,.14);transition:transform .15s,box-shadow .2s,background .3s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ic{width:40px}
.pill{padding:0 13px 0 10px;font-size:13px;font-weight:600;white-space:nowrap}
.ic svg,.pill>svg{width:20px;height:20px;flex:none}
.ic:hover,.pill:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,20,40,.2)}
.ic:active,.pill:active{transform:scale(.96)}
:is(.ic,.pill,.fl,.seg button,.chip,.book,.cta,.pre button,#time):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#phIcon{display:grid;place-items:center;width:24px;height:24px}
#phIcon svg{width:24px;height:24px}
#clk{font-variant-numeric:tabular-nums}
.timewrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(300px,calc(100vw - 28px));padding:14px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right}
.pop.open{opacity:1;visibility:visible;transform:none}
.pop h4{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:10px}
.pre{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.pre button{border:0;background:rgba(120,140,170,.12);height:44px;display:grid;place-items:center;border-radius:12px;cursor:pointer;transition:background .25s,box-shadow .25s,transform .15s}
.pre button svg{width:26px;height:26px;display:block;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pre button:hover{background:rgba(31,123,224,.16)}
.pre button:hover svg{transform:scale(1.12) rotate(-6deg)}
.pre button.on{background:rgba(31,123,224,.22);box-shadow:inset 0 0 0 1.5px rgba(80,150,255,.6)}
#play{font-size:14px}
#time{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;outline:none;background:linear-gradient(90deg,#0b1430 0%,#2a3b78 18%,#f09a5c 24%,#7fc0f5 32%,#9ed1fa 50%,#7fc0f5 68%,#f0845a 76%,#2a3b78 82%,#0b1430 100%)}
#time::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
#time::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer}

/* этажи */
.floors{position:fixed;left:14px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:4px;padding:6px;z-index:3}
.floors .cap{font-size:10px;text-align:center;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;padding:2px 0 3px}
.fl{position:relative;width:44px;height:40px;border:0;border-radius:11px;background:transparent;font-size:15px;font-weight:650;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.fl:hover{background:rgba(31,123,224,.16)}
.fl.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(31,123,224,.5)}
.fl .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.fl .dot.none{background:var(--sold)}
.fl.on .dot{outline:1.5px solid #fff}

/* панель квартир */
.panel{position:fixed;right:14px;top:calc(68px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:360px;display:flex;flex-direction:column;overflow:hidden;z-index:3}
body:not(.picked) .panel{opacity:0;pointer-events:none;transform:translateX(26px)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 14px 10px 18px}
.ph h2{font-size:20px;font-weight:700;letter-spacing:.1px}
.ph p{font-size:12.5px;color:var(--mut);margin-top:3px}
.ph .ic{width:34px;height:34px;border-radius:10px;box-shadow:none;background:rgba(120,140,170,.14);flex:none}
.ph .ic svg{width:16px;height:16px}
.pbody{overflow:auto;padding:2px 14px 16px;flex:1;scrollbar-width:thin}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(120,140,170,.15);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.16)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--bd);background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.plan{margin:12px 0 10px;background:rgba(120,140,170,.1);border-radius:14px;padding:8px}
.plan svg{display:block;width:100%;height:auto}
.pl-bg{fill:var(--solid);opacity:.7;stroke:var(--bd);stroke-width:.25}
.pu rect{transition:opacity .25s,filter .2s;rx:.5}
.pu{cursor:pointer;transition:opacity .25s}
.pu.st-free rect{fill:var(--ok)}.pu.st-hold rect{fill:var(--hold)}.pu.st-sold rect{fill:var(--sold)}
.pu text{fill:#fff;font-size:2.3px;font-weight:700;text-anchor:middle;pointer-events:none}
.pu.dim{opacity:.2}
.pu.hl{filter:drop-shadow(0 0 .5px #1f7be0) drop-shadow(0 0 .5px #1f7be0) brightness(1.1)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin:0 2px 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.units{list-style:none;display:flex;flex-direction:column;gap:8px;padding:0}
.u{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--stc);border-radius:12px;padding:10px 12px;display:grid;gap:6px;transition:box-shadow .2s,border-color .2s}
.u.st-free{--stc:var(--ok)}.u.st-hold{--stc:var(--hold)}.u.st-sold{--stc:var(--sold)}
.u.hl{box-shadow:0 0 0 2px var(--acc)}
.u-top{display:flex;justify-content:space-between;align-items:center}
.u-top b{font-size:15px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:var(--stc)}
.u-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.u-meta span{background:rgba(120,140,170,.14);border-radius:6px;padding:2px 8px}
.u-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.u-bot strong{font-size:16px}
.book{border:0;background:var(--acc);color:#fff;font-size:12.5px;font-weight:650;padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .15s,filter .2s}
.book:hover{filter:brightness(1.1);transform:translateY(-1px)}
.book.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--bd)}
.u.st-sold .u-bot strong{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.u.st-sold .book{display:none}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:22px 8px}

/* окно заявки */
.modal{position:fixed;inset:0;background:rgba(8,16,30,.45);display:grid;place-items:center;padding:16px;z-index:8;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.modal.open{opacity:1;visibility:visible}
.mbox{width:min(380px,100%);padding:22px;position:relative;background:var(--solid)!important;transform:translateY(10px);transition:transform .3s}
.modal.open .mbox{transform:none}
.mbox h3{font-size:18px;margin-bottom:4px}
.mbox p{font-size:13px;color:var(--mut);margin-bottom:14px}
.mbox input{width:100%;height:44px;border-radius:11px;border:1px solid var(--bd);background:transparent;color:var(--ink);padding:0 12px;font:inherit;font-size:14px;margin-bottom:10px}
.mbox input:focus{outline:2px solid var(--acc);outline-offset:1px}
.cta{width:100%;height:46px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.mx{position:absolute;right:10px;top:10px;width:32px;height:32px;box-shadow:none;background:rgba(120,140,170,.14)}
.mx svg{width:15px;height:15px}
.done{text-align:center;padding:14px 0 4px;font-size:14px;line-height:1.5}
.done b{display:block;font-size:34px;color:var(--ok);margin-bottom:4px}

#msg{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0f1a2b;color:#dbe6f6;font-size:15px;text-align:center;padding:24px;z-index:9;transition:opacity .7s}
#msg i{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#6db2ff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{rotate:360deg}}

@media(max-width:760px){
 .ttl p{display:none}.ttl{padding:9px 12px}.ttl h1{font-size:14px}
 .floors{left:8px;padding:4px;gap:2px}
 .fl{width:38px;height:31px;font-size:13px}.floors .cap{display:none}
 .panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:47vh}
 body:not(.picked) .panel{transform:translateY(30px)}
 .ph{padding:10px 10px 6px 14px}.ph h2{font-size:17px}
 .plan{display:none}
 .pill span#qlab{display:none}
 #qual{width:40px;padding:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
 <div class="ttl glass"><h1 id="pName">Жилой комплекс</h1><p id="pTag"></p></div>
 <div class="tools">
  <div class="timewrap">
   <button class="pill" id="timeBtn" aria-expanded="false" aria-controls="timePop" title="Время суток"><span id="phIcon"></span><span id="clk">15:00</span></button>
   <div class="pop glass" id="timePop">
    <h4>Время суток</h4>
    <div class="pre"><button data-h="5.4" data-p="dawn" title="Рассвет" aria-label="Рассвет"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs><path d="M7 22a9 9 0 0 1 18 0z" fill="url(#gr)" stroke="#f08a2c" stroke-width="1.4"/><path d="M16 5v4M6.5 10l2.6 2.6M25.5 10l-2.6 2.6M2.5 18.5h3M26.5 18.5h3" stroke="#ffb02e" stroke-width="2"/><path d="M3 22h26" stroke="#8fa0bb" stroke-width="2"/><path d="M12.5 28l3.5-3.5 3.5 3.5" stroke="#8fa0bb" stroke-width="2"/></svg></button><button data-h="12.5" data-p="day" title="День" aria-label="День"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round"><defs><radialGradient id="gd" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff2a8"/><stop offset=".55" stop-color="#ffc83a"/><stop offset="1" stop-color="#ff9d1c"/></radialGradient></defs><circle cx="16" cy="16" r="6.4" fill="url(#gd)" stroke="#f59a1c" stroke-width="1.2"/><path d="M16 3.5v3.6M16 24.9v3.6M3.5 16h3.6M24.9 16h3.6M7.2 7.2l2.5 2.5M22.3 22.3l2.5 2.5M7.2 24.8l2.5-2.5M22.3 9.7l2.5-2.5" stroke="#ffb02e" stroke-width="2.2"/></svg></button><button data-h="18.1" data-p="dusk" title="Закат" aria-label="Закат"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb55a"/><stop offset="1" stop-color="#e8445a"/></linearGradient></defs><path d="M7 22a9 9 0 0 1 18 0z" fill="url(#gs)" stroke="#e0584f" stroke-width="1.4"/><path d="M16 7v3.5M6.5 12l2.4 2.4M25.5 12l-2.4 2.4M2.5 19h3M26.5 19h3" stroke="#ff8e52" stroke-width="2"/><path d="M3 22h26" stroke="#8fa0bb" stroke-width="2"/><path d="M12.5 24.5l3.5 3.5 3.5-3.5" stroke="#8fa0bb" stroke-width="2"/></svg></button><button data-h="22" data-p="night" title="Ночь" aria-label="Ночь"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#9fb2f0"/></linearGradient></defs><path d="M25.5 19.2A11 11 0 1 1 12.8 6.5a8.6 8.6 0 0 0 12.7 12.7z" fill="url(#gm)" stroke="#8196d8" stroke-width="1.3"/><path d="M24 5.5v4M22 7.5h4M28.5 13v2.6M27.2 14.3h2.6" stroke="#cfdaff" stroke-width="1.7"/></svg></button><button id="play" title="Время идёт" aria-label="Автоход времени">▶</button></div>
    <input id="time" type="range" min="0" max="24" step="0.01" value="15" aria-label="Время суток">
   </div>
  </div>
  <button class="pill" id="qual" title="Качество графики"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.3 3.8L17 18.5 12 15.6 7 18.5l1.3-5.7L4 9l5.8-.7z"/></svg><span id="qlab">Ультра</span></button>
  <button class="ic" id="reset" title="Сбросить вид" aria-label="Сбросить вид"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
 </div>
</div>
<nav class="floors glass" id="floors" aria-label="Этажи"><div class="cap">этаж</div></nav>
<aside class="panel glass" id="panel" aria-label="Квартиры на этаже">
 <div class="ph"><div><h2 id="pTitle"></h2><p id="pSub"></p></div><button class="ic" id="pClose" aria-label="Закрыть"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
 <div class="pbody">
  <div class="seg" id="fStatus"><button class="on" data-v="all">Все</button><button data-v="free">Свободно</button><button data-v="hold">Бронь</button><button data-v="sold">Продано</button></div>
  <div class="chips" id="fRooms" aria-label="Комнаты"></div>
  <div class="plan" id="plan"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Свободна</span><span><i style="background:var(--hold)"></i>Бронь</span><span><i style="background:var(--sold)"></i>Продана</span></div>
  <ul class="units" id="units"></ul>
 </div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mbox glass">
 <button class="ic mx" id="mClose" aria-label="Закрыть"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
 <div id="mFormWrap"><h3 id="mTitle">Бронирование</h3><p id="mSub"></p>
  <form id="mForm"><input name="name" placeholder="Ваше имя" autocomplete="name" required><input name="phone" type="tel" placeholder="Телефон" autocomplete="tel" required><button class="cta" type="submit">Отправить заявку</button></form></div>
 <div class="done" id="mDone" hidden><b>✓</b>Заявка принята.<br><span style="color:var(--mut);font-size:13px">Менеджер свяжется с вами в ближайшее время.</span></div>
</div></div>
<div id="msg"><i></i><span>Загружаю модель…</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>

  units:{              // точечные правки: '<этаж>-<квартира 1..6>'

  SK.uSunDir.value.copy(sdir);SK.uMoonDir.value.copy(mdir);
  const dayF=sm(-.04,.32,e),nightF=1-sm(-.17,.03,e);
  SK.uSunCol.value.copy(C(0xff6f2a)).lerp(C(0xfff4e2),sm(-.02,.42,e));
  SK.uSunV.value=sm(-.3,.0,e);
  SK.uMoonV.value=sm(-.02,.2,mdir.y)*(1-.9*dayF);
  SK.uStar.value=sm(-.12,-.3,e)*sm(-.02,.15,mdir.y+.1)+0*nightF;
  SK.uStar.value=clamp(sm(-.06,-.26,e));
  // облака: освещённая и теневая стороны
  const warm=sm(-.14,.14,e);
  SK.uCl.value.copy(C(0x0f1424)).lerp(C(0x3a4a78),SK.uMoonV.value*.6).lerp(tmp1.copy(SK.uSunCol.value).multiplyScalar(.95).lerp(C(0xffffff),dayF*.8),warm);
  SK.uCd.value.copy(SK.uHor.value).multiplyScalar(.5).lerp(SK.uTop.value,.35).multiplyScalar(lerp(.7,1.0,dayF));
  scene.fog.color.copy(SK.uHor.value);
  // свет
  sun.position.copy(sdir).multiplyScalar(140).add(sun.target.position);
  sun.intensity=3.4*sm(-.03,.22,e);sun.color.copy(C(0xff8a45)).lerp(C(0xfff1de),sm(0,.4,e));
  moon.position.copy(mdir).multiplyScalar(140).add(moon.target.position);
  moon.intensity=.34*sm(-.02,.25,mdir.y)*(1-dayF);
  hemi.intensity=lerp(.07,.22,dayF);hemi.color.copy(SK.uTop.value).lerp(C(0xffffff),.5);hemi.groundColor.copy(C(0x58663f)).multiplyScalar(lerp(.12,1,dayF));
  renderer.toneMappingExposure=lerp(1.25,1.0,dayF);
  const nn=1-sm(-.13,.07,e);U.uNight.value=nn;
  const lt=sm(.15,.9,nn);
  lamps.forEach(l=>{l.b.color.copy(C(0x8a9097)).lerp(C(0xffeec0),lt);l.g.opacity=lt*.9;l.p.opacity=lt*.5});
  if(carParts.head){carParts.head.forEach(m=>m.color.copy(C(0xd8dde4)).lerp(C(0xffffff),lt));carParts.tail.forEach(m=>m.color.copy(C(0x5a0d0d)).lerp(C(0xff2a1a),lt));carParts.glow.forEach(o=>o.m.opacity=lt*o.k)}
  // UI
  const hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);
  $('#clk').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const phs=e<-.09?'night':e<.22?(h<12?'dawn':'dusk'):'day';
  if(phs!==lastPhase){lastPhase=phs;setPhIcon(phs);document.querySelectorAll('.pre button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===phs))}
  if(bloomPass){bloomPass.strength=lerp(.2,.62,nn);bloomPass.threshold=lerp(.92,.8,nn);bloomPass.radius=lerp(.6,.85,nn)}
  const plI=lt*2.3;plights.forEach(L=>L.intensity=plI);
  document.body.classList.toggle('night',e<-.04);
  if(force||Math.abs(h-lastEnvH)>.12){lastEnvH=h;updateEnv()}
}
const tm=$('#time');
tm.addEventListener('input',()=>{hour=+tm.value;hourT=null;playing=false;$('#play').textContent='▶'});
document.querySelectorAll('.pre button[data-h]').forEach(b=>b.onclick=()=>{hourT=+b.dataset.h;playing=false;$('#play').textContent='▶'});
$('#play').onclick=()=>{playing=!playing;hourT=null;$('#play').textContent=playing?'❚❚':'▶'};

/* ---------- данные квартир ---------- */
const P=PROJECT;
const rectArea=r=>r.reduce((s,q)=>s+(q[1]-q[0])*(q[3]-q[2]),0);
function orient(rs){let a=0,cx=0,cz=0;rs.forEach(q=>{const s=(q[1]-q[0])*(q[3]-q[2]);a+=s;cx+=s*(q[0]+q[1])/2;cz+=s*(q[2]+q[3])/2});cx/=a;cz/=a;return(cz<-3?'С':'Ю')+(Math.abs(cx)>12?(cx<0?'З':'В'):'')}
const UNITS=[];
for(let f=1;f<=8;f++)APT.forEach((rs,n)=>{
  const area=Math.round(rectArea(rs)*P.areaFactor);
  const u={f,n,id:f+'-'+(n+1),num:f*100+n+1,rects:rs,area,rooms:area<50?1:area<75?2:3,orient:orient(rs),
    status:isFree(f,n)?'free':((f+n*2)%3===0?'hold':'sold')};
  u.price=Math.round(area*(P.pricePerM2+(f-1)*P.floorStep)/1e4)*1e4;
  Object.assign(u,P.units[u.id]||{});UNITS.push(u)});
const ST={free:'Свободна',hold:'Бронь',sold:'Продана'};
const byId=id=>UNITS.find(u=>u.id===id);
const fmtP=p=>p>=1e6?(p/1e6).toFixed(1).replace('.',',')+' млн '+P.currency:Math.round(p).toLocaleString('ru-RU')+' '+P.currency;
const fs={st:'all',rm:0};
const match=u=>(fs.st==='all'||u.status===fs.st)&&(!fs.rm||u.rooms===fs.rm);
$('#pName').textContent=P.name;$('#pTag').textContent=P.tagline;document.title=P.name+' — 3D-вьюер';

/* ---------- время суток: компактный поповер ---------- */
const tp=$('#timePop'),tb=$('#timeBtn');
const setPop=o=>{tp.classList.toggle('open',o);tb.setAttribute('aria-expanded',o)};
tb.onclick=()=>setPop(!tp.classList.contains('open'));
addEventListener('pointerdown',e=>{if(tp.classList.contains('open')&&!tp.contains(e.target)&&!tb.contains(e.target))setPop(false)});
function setPhIcon(p){const s=document.querySelector('.pre button[data-p="'+p+'"] svg');if(s)$('#phIcon').innerHTML=s.outerHTML}

/* ---------- этажи ---------- */
let floor=0,ty=HOME.t.y,selTarget=0;
const floorsEl=$('#floors'),flBtns=[];
for(let f=8;f>=1;f--){
  const us=UNITS.filter(u=>u.f===f),free=us.filter(u=>u.status==='free').length;
  const b=document.createElement('button');b.className='fl';b.title='Этаж '+f+' · свободно '+free+' из '+us.length;
  b.innerHTML='<span>'+f+'</span><i class="dot'+(free?'':' none')+'"></i>';
  b.onclick=()=>setFloor(floor===f?0:f);floorsEl.appendChild(b);flBtns[f]=b}
const rmSet=[...new Set(UNITS.map(u=>u.rooms))].sort();
$('#fRooms').innerHTML='<button class="chip on" data-v="0">Любая</button>'+rmSet.map(r=>'<button class="chip" data-v="'+r+'">'+r+' комн.</button>').join('');

function renderPanel(){
  if(!floor)return;
  const us=UNITS.filter(u=>u.f===floor),free=us.filter(u=>u.status==='free').length;
  $('#pTitle').textContent='Этаж '+floor;
  $('#pSub').textContent='Свободно '+free+' из '+us.length+' · пол на высоте +'+FL[floor-1].toFixed(1)+' м';
  let g='';
  us.forEach(u=>{
    const rs=u.rects.map(q=>'<rect x="'+q[0]+'" y="'+q[2]+'" width="'+(q[1]-q[0]).toFixed(2)+'" height="'+(q[3]-q[2]).toFixed(2)+'"/>').join('');
    const big=u.rects.reduce((b,q)=>(q[1]-q[0])*(q[3]-q[2])>(b[1]-b[0])*(b[3]-b[2])?q:b);
    g+='<g class="pu st-'+u.status+(match(u)?'':' dim')+'" data-id="'+u.id+'">'+rs+'<text x="'+((big[0]+big[1])/2).toFixed(2)+'" y="'+(((big[2]+big[3])/2)+.8).toFixed(2)+'">'+u.num+'</text></g>'});
  $('#plan').innerHTML='<svg viewBox="-24 -17.5 48 36" role="img" aria-label="План этажа"><rect class="pl-bg" x="-22.6" y="-15.8" width="45.2" height="32.9" rx="1.2"/>'+g+'</svg>';
  const list=us.filter(match);
  $('#units').innerHTML=list.length?list.map(u=>
    '<li class="u st-'+u.status+'" data-id="'+u.id+'"><div class="u-top"><b>Кв. '+u.num+'</b><span class="badge">'+ST[u.status]+'</span></div>'+
    '<div class="u-meta"><span>'+u.rooms+' комн.</span><span>'+u.area+' м²</span><span>окна '+u.orient+'</span></div>'+
    '<div class="u-bot"><strong>'+fmtP(u.price)+'</strong><button class="book'+(u.status==='hold'?' ghost':'')+'" data-id="'+u.id+'">'+(u.status==='free'?'Забронировать':'Оставить заявку')+'</button></div></li>').join('')
    :'<li class="empty">Нет квартир по выбранным фильтрам</li>'}

function setFloor(f){
  floor=f;ty=f?FL[f-1]+2:HOME.t.y;
  if(f){U.uSel.value.set(FL[f-1]-.05,f<8?FL[f]-.05:ROOF);selTarget=1}else selTarget=0;
  flBtns.forEach((b,i)=>b&&b.classList.toggle('on',i===f));
  document.body.classList.toggle('picked',!!f);
  if(f){renderPanel();$('.pbody').scrollTop=0}
  shiftTarget()}
$('#pClose').onclick=()=>setFloor(0);
$('#reset').onclick=()=>{ctl.target.copy(HOME.t);goHome();setFloor(0)};
$('#fStatus').onclick=e=>{const b=e.target.closest('button');if(!b)return;fs.st=b.dataset.v;
  document.querySelectorAll('#fStatus button').forEach(x=>x.classList.toggle('on',x===b));renderPanel()};
$('#fRooms').onclick=e=>{const b=e.target.closest('button');if(!b)return;fs.rm=+b.dataset.v;
  document.querySelectorAll('#fRooms button').forEach(x=>x.classList.toggle('on',x===b));renderPanel()};
const hl=(id,on)=>document.querySelectorAll('[data-id="'+id+'"]').forEach(el=>{if(el.classList.contains('pu')||el.classList.contains('u'))el.classList.toggle('hl',on)});
for(const sel of ['#plan','#units']){
  $(sel).addEventListener('pointerover',e=>{const el=e.target.closest('[data-id]');if(el)hl(el.dataset.id,true)});
  $(sel).addEventListener('pointerout',e=>{const el=e.target.closest('[data-id]');if(el)hl(el.dataset.id,false)})}
$('#plan').addEventListener('click',e=>{const el=e.target.closest('.pu');if(!el)return;
  const li=$('#units').querySelector('.u[data-id="'+el.dataset.id+'"]');if(li)li.scrollIntoView({behavior:'smooth',block:'nearest'})});
$('#units').addEventListener('click',e=>{const b=e.target.closest('.book');if(b)openModal(b.dataset.id)});

/* ---------- заявка ---------- */
const modal=$('#modal');let bookU=null;
function openModal(id){bookU=byId(id);if(!bookU)return;
  $('#mTitle').textContent=(bookU.status==='free'?'Бронирование':'Заявка')+' · кв. '+bookU.num;
  $('#mSub').textContent=bookU.rooms+' комн. · '+bookU.area+' м² · '+fmtP(bookU.price);
  $('#mFormWrap').hidden=false;$('#mDone').hidden=true;$('#mForm').reset();
  modal.classList.add('open');setTimeout(()=>$('#mForm input').focus(),80)}
const closeModal=()=>modal.classList.remove('open');
$('#mClose').onclick=closeModal;
modal.addEventListener('pointerdown',e=>{if(e.target===modal)closeModal()});
$('#mForm').onsubmit=e=>{e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  try{P.onBook&&P.onBook(bookU,d)}catch(err){console.warn(err)}
  $('#mFormWrap').hidden=true;$('#mDone').hidden=false;setTimeout(closeModal,2600)};

addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else if(tp.classList.contains('open'))setPop(false);else setFloor(0);return}
  if(e.target.tagName==='INPUT'||modal.classList.contains('open'))return;
  if(e.key==='ArrowUp')setFloor(floor===0?1:floor<8?floor+1:8);
  if(e.key==='ArrowDown')setFloor(floor<=1?0:floor-1)});

/* ---------- сдвиг кадра: здание не прячется за панелью ---------- */
const VO={x:0,y:0,tx:0,ty:0};
function shiftTarget(){
  if(!floor){VO.tx=0;VO.ty=0;return}
  if(innerWidth>760){VO.tx=150;VO.ty=0}else{VO.tx=0;VO.ty=innerHeight*.2}}
function viewTick(dt){
  const k=Math.min(1,dt*8),dx=VO.tx-VO.x,dy=VO.ty-VO.y;
  if(Math.abs(dx)<.4&&Math.abs(dy)<.4){VO.x=VO.tx;VO.y=VO.ty}else{VO.x+=dx*k;VO.y+=dy*k}
  if(VO.x||VO.y){cam.setViewOffset(innerWidth,innerHeight,VO.x,VO.y,innerWidth,innerHeight)}
  else if(cam.view&&cam.view.enabled){cam.clearViewOffset()}}
setFloor(0);

/* ---------- мышь ---------- */
const cv=$('#c'),ray=new T.Raycaster(),mouse=new T.Vector2();let down=null,dragging=false;
const floorAt=y=>{if(y>ROOF+.15||y<FL[0]-.2)return 0;let f=1;for(let i=0;i<8;i++)if(y>=FL[i]-.05)f=i+1;return f};
function pick(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,cam);
  const h=ray.intersectObjects(bld.children)[0];return h?floorAt(h.point.y):0}
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};dragging=false});
cv.addEventListener('pointerup',e=>{
  const d=down;down=null;if(!d||dragging||Math.hypot(e.clientX-d.x,e.clientY-d.y)>5)return;
  const f=pick(e);setFloor(f&&f!==floor?f:0)});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);if(composer)composer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new T.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.1);U.uTime.value+=dt;
  if(playing){hour=(hour+dt*1.4)%24;tm.value=hour}
  else if(hourT!==null){let d=(hourT-hour+24)%24;const st=Math.min(d,dt*7);hour=(hour+st)%24;tm.value=hour;if(d<.02)hourT=null}
  if(Math.abs(hour-lastH)>1e-4){applyTime(hour);lastH=hour}
  U.uSelAmt.value+=(selTarget-U.uSelAmt.value)*Math.min(1,dt*9);
  const dy=(ty-ctl.target.y)*.06;ctl.target.y+=dy;cam.position.y+=dy;
  movers.forEach(m=>{m.c.position.x+=m.dir*m.v*dt;if(m.c.position.x>270)m.c.position.x=-270;if(m.c.position.x<-270)m.c.position.x=270});
  sky.position.copy(cam.position);
  viewTick(dt);ctl.update();
  grassTick(dt);
  if(composer&&ULTRA){tonePass.uniforms.exposure.value=renderer.toneMappingExposure;finalPass.uniforms.uTime.value=U.uTime.value%100;finalPass.uniforms.uNight.value=U.uNight.value;composer.render(dt)}
  else renderer.render(scene,cam)});
initPost();

$('#qual').onclick=()=>{
  ULTRA=!ULTRA;
  if(composer)renderer.toneMapping=ULTRA?T.NoToneMapping:T.ACESFilmicToneMapping;
  refreshMaterials();
  if(grass)grass.visible=ULTRA;
  renderer.setPixelRatio(ULTRA?PR:Math.min(devicePixelRatio||1,1.25));resize();
  $('#qlab').textContent=''+(ULTRA?'Ультра':'Лёгкое');
};
if(LITE||!composer){ULTRA=false;$('#qlab').textContent='Лёгкое';renderer.toneMapping=T.ACESFilmicToneMapping;if(grass)grass.visible=false}

applyTime(hour,true);tm.value=hour;
Promise.all([loadBld()]).then(()=>{try{buildTrees();buildCars()}catch(e){console.warn('scenery',e)}
  try{buildAO();buildGrass()}catch(e){console.warn('grass',e)}
  const m=$('#msg');m.style.opacity=0;setTimeout(()=>m.remove(),800)})
 .catch(e=>$('#msg').lastChild.textContent='Не удалось загрузить модель: '+e.message);
</script>
</body>
</html>
